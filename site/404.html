<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Kevin Manoti</title>
  <style>
    /* Self-contained: GitHub Pages serves this file at any missing path, where relative links to styles.css may not resolve. */
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0e12; color: #e7eaee;
           font: 16px/1.6 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding: 16px; text-align: center; }
    p { color: #a3adb8; }
    code { font-family: ui-monospace, Consolas, monospace; color: #34d399; }
    a { color: #34d399; font-weight: 600; }
    a:focus-visible { outline: 2px solid #34d399; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p><code>404</code></p>
    <h1>Page not found</h1>
    <p>That page doesn't exist or has moved.</p>
    <p><a id="home" href="/">Go to the home page</a></p>
  </main>
  <script>
    // On a project site (username.github.io/<repo>/) the home page is the first path segment.
    var seg = location.pathname.split('/').filter(Boolean)[0];
    if (location.hostname.endsWith('github.io') && seg && location.hostname.split('.')[0].toLowerCase() !== seg.toLowerCase()) {
      document.getElementById('home').href = '/' + seg + '/';
    }
  </script>
</body>
</html>
